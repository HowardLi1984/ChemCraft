tools:
  - class_name: verl.tools.chem_tool.SearchTool
    config:
      retrieval_service_url: http://127.0.0.1:8080/chem_function
      num_workers: 120
      rate_limit: 120
      timeout: 30
      type: native
    tool_schema:
      type: function
      function:
        name: search
        description: Searches the web for chemical results based on the given query.
        parameters:
          type: object
          properties:
            query_list:
              type: array
              item:
                type: string
              description: A list of fully-formed semantic queries. The tool will return search results for each query.
          required: 
            - query_list