      retrieval_service_url: http://127.0.0.1:8080/chem_function
      num_workers: 10
      rate_limit: 120
      timeout: 500
      type: native
    tool_schema:
      type: function
      function:
        name: CanonicalizeSMILES
        description: "Canonicalize SMILES representation. Input SMILES, returns canonicalized SMILES. You should use this tool when asked for canonicalized SMILES."
        parameters:
          type: object
          properties:
            SMILES:
              type: string
              description: "The molecule SMILES string"
          required: 
            - SMILES
  
