      rate_limit: 120
      timeout: 500
      type: native
    tool_schema:
      type: function
      function:
        name: ReplaceFunctionalGroup
        description: "Replace a functional group in a molecule with another functional group using functional group names."
        parameters:
          type: object
          properties:
            SMILES:
              type: string
              description: "The molecule SMILES string"
            old_group_name:
              type: string
              description: "The old functional group to remove"
            new_group_name:
              type: string
              description: "The new functional group to add"
          required: 
