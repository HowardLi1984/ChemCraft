data:
  train_batch_size: 32
  micro_batch_size: null
  micro_batch_size_per_gpu: 2
  train_files: ../search_saves/datasets/chemcot/chemcot_json/chemcot-sft/train_sft.parquet
  val_files: ../search_saves/datasets/chemcot/chemcot_json/chemcot-sft/test_sft.parquet
  prompt_key: question
  response_key: answer
  prompt_dict_keys: null
  response_dict_keys: null
  multiturn:
    enable: false
    messages_key: messages
    tools_key: tools
    enable_thinking_key: enable_thinking
  max_length: 4096
  truncation: error
  balance_dp_token: false
  chat_template: null
  custom_cls:
    path: null
    name: null
  use_shm: true
model:
  partial_pretrain: /mnt/workspace/lh/ChemSearch/search_saves/checkpoints/qwen/Qwen2.5-7B-Instruct
  use_shm: true
  fsdp_config:
    model_dtype: bf16
    wrap_policy:
      min_num_params: 0
    cpu_offload: true
    offload_params: true
  external_lib: null
  enable_gradient_checkpointing: true
  trust_remote_code: true
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: false
  strategy: fsdp
optim:
  lr: 2.0e-05
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
use_remove_padding: false
trainer:
  default_local_dir: ../search_saves/verl_checkpoints/chemcot-sft-nips-qwen25-7B-Instruct
  default_hdfs_dir: null
  resume_path: null
  project_name: chemcot-sft-nips-qwen25-7B-Instruct
  experiment_name: chemcot-sft-nips-qwen25-7B-Instruct
  total_epochs: 4
  total_training_steps: 200
  logger:
  - console
  seed: 1
  save_freq: 10
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 8
  max_ckpt_to_keep: null
