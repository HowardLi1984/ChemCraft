hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data.use_shm=True
    - data.train_files=../search_saves/datasets/chemcot/chemcot_json/chemcot-tool-coldstart/train_tool_coldstart.parquet
    - data.val_files=../search_saves/datasets/chemcot/chemcot_json/chemcot-tool-coldstart/test_tool_coldstart.parquet
    - data.prompt_key=question
    - data.response_key=answer
    - data.prompt_dict_keys=null
    - data.response_dict_keys=null
    - optim.lr=2e-5
    - data.train_batch_size=48
    - data.micro_batch_size_per_gpu=2
    - data.max_length=8192
    - data.truncation=right
    - ulysses_sequence_parallel_size=1
    - model.use_shm=True
    - model.partial_pretrain=../search_saves/checkpoints/qwen/Qwen2.5-7B-Instruct
    - model.fsdp_config.model_dtype=bf16
    - model.fsdp_config.cpu_offload=True
    - model.fsdp_config.offload_params=True
    - model.enable_gradient_checkpointing=True
    - model.trust_remote_code=True
    - model.target_modules=all-linear
    - model.strategy=fsdp
    - trainer.default_local_dir=../search_saves/verl_checkpoints/chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko
    - trainer.project_name=chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko
    - trainer.experiment_name=chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko
    - trainer.logger=[console]
    - trainer.total_training_steps=1500
    - trainer.save_freq=50
    - trainer.total_epochs=4
    - trainer.default_hdfs_dir=null
  job:
    name: fsdp_sft_trainer
    chdir: null
    override_dirname: data.max_length=8192,data.micro_batch_size_per_gpu=2,data.prompt_dict_keys=null,data.prompt_key=question,data.response_dict_keys=null,data.response_key=answer,data.train_batch_size=48,data.train_files=../search_saves/datasets/chemcot/chemcot_json/chemcot-tool-coldstart/train_tool_coldstart.parquet,data.truncation=right,data.use_shm=True,data.val_files=../search_saves/datasets/chemcot/chemcot_json/chemcot-tool-coldstart/test_tool_coldstart.parquet,model.enable_gradient_checkpointing=True,model.fsdp_config.cpu_offload=True,model.fsdp_config.model_dtype=bf16,model.fsdp_config.offload_params=True,model.partial_pretrain=../search_saves/checkpoints/qwen/Qwen2.5-7B-Instruct,model.strategy=fsdp,model.target_modules=all-linear,model.trust_remote_code=True,model.use_shm=True,optim.lr=2e-5,trainer.default_hdfs_dir=null,trainer.default_local_dir=../search_saves/verl_checkpoints/chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko,trainer.experiment_name=chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko,trainer.logger=[console],trainer.project_name=chemcot-tool-coldstart-qwen-7B-full-tool-assistant-murcko,trainer.save_freq=50,trainer.total_epochs=4,trainer.total_training_steps=1500,ulysses_sequence_parallel_size=1
    id: ???
    num: ???
    config_name: sft_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /cto_labs/lihao/chem_reason/ChemSearch/search_sft
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /cto_labs/lihao/chem_reason/ChemSearch/search_sft/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /cto_labs/lihao/chem_reason/ChemSearch/search_sft/outputs/2025-10-07/00-15-49
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
